services:
  - type: web
    name: anyrb
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m server.app --host 0.0.0.0 --port $PORT
    envVars:
      - key: META_API_KEY
        sync: false
      - key: ANYRB_PORT
        value: 8787
      - key: ANYRB_RATE_LIMIT_RPM
        value: 120
      - key: PYTHON_VERSION
        value: 3.12.7
